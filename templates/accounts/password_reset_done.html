{% extends 'base.html' %}
{% block title %}Email envoyé — BKLbusiness{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4 text-center" style="border-radius:20px">
            <span style="font-size:4rem">📧</span>
            <h3 class="fw-bold mt-3">Email envoyé !</h3>
            <p class="text-muted">
                Si ton adresse email existe dans notre système,
                tu recevras un lien pour réinitialiser ton mot de passe.
            </p>
            <a href="/accounts/login/" class="btn btn-primary">
                <i class="bi bi-arrow-left me-2"></i>Retour à la connexion
            </a>
        </div>
    </div>
</div>
{% endblock %}
