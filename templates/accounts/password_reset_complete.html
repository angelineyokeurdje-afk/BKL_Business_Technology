{% extends 'base.html' %}
{% block title %}Mot de passe changé — BKLbusiness{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4 text-center" style="border-radius:20px">
            <span style="font-size:4rem">✅</span>
            <h3 class="fw-bold mt-3">Mot de passe changé !</h3>
            <p class="text-muted">
                Ton mot de passe a été réinitialisé avec succès.
                Tu peux maintenant te connecter.
            </p>
            <a href="/accounts/login/" class="btn btn-primary btn-lg">
                <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
            </a>
        </div>
    </div>
</div>
{% endblock %}
